name: Compilar APK SENDA PLUS

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senda-plus-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estructura del proyecto
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Compilar APK Debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK generado
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: No se genero el APK esperado: $APK"
            exit 1
          fi
          ls -lh "$APK"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SENDA-PLUS-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
