name: Compilar APK SENDA PLUS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senda-plus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v7

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find . -type f -name settings.gradle.kts \
            -not -path '*/.gradle/*' -not -path '*/build/*' | sort | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No existe settings.gradle.kts. Debes subir TODO el contenido de este ZIP al repositorio, no solamente main.yml."
            echo "Contenido actual del repositorio:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -f "$PROJECT_DIR/build.gradle.kts" || { echo "::error::Falta build.gradle.kts"; exit 1; }
          test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo "::error::Falta app/build.gradle.kts"; exit 1; }
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || { echo "::error::Falta AndroidManifest.xml"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Android localizado en: $PROJECT_DIR"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK generado
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::No se genero el APK esperado: $APK_PATH"
            find "${PROJECT_DIR}/app/build/outputs" -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: SENDA-PLUS-APK-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
